<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gltf-studio</title>

    <!--
      The compiled-engine path (packages/play's engine-host.ts,
      buildCompiledEngine) transpiles a KHR_interactivity graph to a JS
      module string via @gltfi/emit-ts, loads it from a `blob:` module URL
      via dynamic import(), and that module's own
      `import { createEngine, m } from "@gltfi/runtime-lib";` statement needs
      somewhere to resolve to — browsers resolve a bare specifier in ANY
      module script (blob: origin included) against the document's own
      import map, so one entry here is all that's needed. The target is a
      self-contained bundle (see scripts/bundle-runtime-lib.mjs, run as
      predev/prebuild) written to public/, which Vite serves at this exact
      path (relative to the app's own base) in both `vite` (dev) and
      `vite build && vite preview`. `%BASE_URL%` is Vite's HTML env
      replacement (resolves to `import.meta.env.BASE_URL`, i.e. the
      configured `base` — see vite.config.ts) rather than a hardcoded `/`:
      this file is static text, not a Vite-processed asset reference, so it
      would otherwise silently resolve against the document origin instead
      of wherever the app is actually served from (`/app/` locally,
      `/<repo>/app/` once deployed) — exactly the class of bug that broke
      the compiled-engine path on a base-path change once before.
    -->
    <script type="importmap">
      { "imports": { "@gltfi/runtime-lib": "%BASE_URL%gltfi-runtime-lib.mjs" } }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
