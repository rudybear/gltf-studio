name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` input — the repo's package.json "packageManager" field
      # (pnpm@11.18.0) governs which pnpm gets installed. Passing a
      # conflicting `version:` here has broken CI on a sibling repo before.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install
      # Regression guard for the "strict not inheriting from
      # tsconfig.base.json" DX bug (external report, fixed by adding
      # `extends` to the root tsconfig.json): asserts every tsconfig.json
      # in the repo resolves `strict: true` in its EFFECTIVE options.
      - run: pnpm check:strict
      - run: pnpm build
      - run: pnpm test
      # packages/engine-three's RenderHost contract suite runs in a real
      # browser (vitest browser mode, Playwright provider, headless
      # Chromium) rather than jsdom/node, so WebGL/canvas/pointer-capture
      # all behave like a real editor session. Uses the runner's own
      # pre-installed Google Chrome (`channel: "chrome"` in
      # packages/engine-three/vitest.config.ts) instead of downloading
      # Playwright's bundled Chromium — ubuntu-latest ships one already.
      # `--no-sandbox` (baked into that same config's launch args) is
      # required for Chrome to run at all under the runner's restricted
      # container — this repo's CI history shows Chrome needs it here.
      - run: pnpm test:browser
      - run: pnpm lint
      - run: node scripts/check-drift.mjs
      - run: node scripts/gen-status.mjs --check
      - run: node --test scripts/drift.test.mjs

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install
      # e2e targets the BUILT app (playwright.config.ts's webServer runs
      # `vite preview`, not the dev server) — build first, same as the
      # `build` job, since jobs don't share a filesystem across runners.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # e2e/golden-path.spec.ts's per-step screenshots (gitignored, see
      # .gitignore) — uploaded unconditionally (not just on failure) since
      # they document the full user journey for a human to skim, not only
      # a failure trail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-screenshots
          path: e2e/artifacts/golden-path/
          retention-days: 30
