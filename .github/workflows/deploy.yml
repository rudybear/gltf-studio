name: Deploy Pages

# Runs after CI (ci.yml) finishes on main, and only deploys if CI actually
# passed — `workflow_run` (rather than a second `push` trigger) is the
# gate: a `push`-triggered deploy would happily ship a build with failing
# tests, since it has no dependency on the CI workflow's own conclusion.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment in flight at a time; a newer push's deploy
# should win over an older one still running, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # BASE_PATH (packages/app/vite.config.ts, PR #6, revised for the
      # landing-page restructure): this repo is served as a GitHub Pages
      # PROJECT site (https://<owner>.github.io/<repo>/), not a user/org
      # root site, AND the editor no longer occupies that root itself — a
      # hand-written landing page (`/site/`) does, with the editor one
      # level below it at `/<repo>/app/`. Every asset URL and the
      # sample-scene fetch (Viewport.tsx's `import.meta.env.BASE_URL`) need
      # that full `/<repo>/app/` prefix baked in at build time.
      - name: Build app (BASE_PATH=/${{ github.event.repository.name }}/app/)
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/app/

      # Assembles the deployed site out-of-tree: `/site/*` (the landing
      # page) at the artifact root, `docs/media/*` (the screenshots the
      # landing page and README both reference — kept in one committed
      # location rather than duplicated) copied alongside it, and the
      # already-built editor under `app/`. Pages serves whatever directory
      # structure this artifact has, so this one assembly step is the only
      # place that structure is decided.
      - name: Assemble Pages site (landing at root, editor at /app/)
        run: |
          set -e
          mkdir -p dist-site
          cp -r site/. dist-site/
          mkdir -p dist-site/media
          cp -r docs/media/. dist-site/media/
          cp -r packages/app/dist dist-site/app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
